name: Test

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**/*.[tj]s'
      - '**/*.?[tj]s'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.npmrc'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        # 6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test

      - name: Compile native executable
        run: bun run build:verify-peer-review

      - name: Smoke test native executable
        run: |
          set +e
          OUTPUT="$(./dist/verify-peer-review-linux-x64 2>&1)"
          STATUS=$?
          set -e
          test "$STATUS" -eq 1
          grep --fixed-strings 'Missing required CLI argument' <<< "$OUTPUT"

      - name: Tell people how to run the failing check
        if: failure()
        run: echo "::error::The test check failed! To run it locally, run \`bun install && bun test\` from the GitHub-Actions repo root."
