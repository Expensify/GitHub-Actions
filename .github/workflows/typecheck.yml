name: Typecheck

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**/*.[tj]s'
      - '**/*.?[tj]s'
      - 'tsconfig.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.npmrc'
      - '.github/workflows/typecheck.yml'

jobs:
  typecheck:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        # 6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tell people how to run the failing check
        if: failure()
        run: echo "::error::The typecheck check failed! To run it locally, run \`bun install && bun run typecheck\` from the GitHub-Actions repo root."
