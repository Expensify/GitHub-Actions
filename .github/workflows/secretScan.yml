# Scans a repository for committed credentials with TruffleHog.
#
# The scan scope follows the event that triggered the calling workflow, because the TruffleHog
# action derives its own --since-commit and --branch from github.event_name:
#   - pull_request                    -> scans only the commits in the pull request
#   - schedule / workflow_dispatch    -> scans the full history of the default branch
#   - push                            -> scans the commits in the push
#
# So a caller repository needs two workflows to get both diff and full-history coverage: one on
# pull_request, and one on schedule.
name: Secret scan

on:
  workflow_call:
    inputs:
      fail_on_findings:
        description: Fail the job when TruffleHog reports a finding. Leave false to warn only while measuring the false-positive rate.
        required: false
        default: false
        type: boolean
      exclude_paths_file:
        description: Repository-relative path to a file of newline-separated regexes for paths to skip. Ignored when the file does not exist.
        required: false
        default: .github/trufflehog-exclude-paths.txt
        type: string
      runner:
        description: Runner label for the scan job. Use a larger runner for full-history scans of large repositories.
        required: false
        default: blacksmith-2vcpu-ubuntu-2404
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: TruffleHog
    runs-on: ${{ inputs.runner }}
    steps:
      # The action resolves --since-commit to the pull request base SHA, which a shallow clone
      # does not contain, so fetch the full history.
      - name: Checkout
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Resolve TruffleHog arguments
        id: trufflehogArgs
        env:
          EXCLUDE_PATHS_FILE: ${{ inputs.exclude_paths_file }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        shell: bash
        run: |
          set -euo pipefail

          # Scan without verification. Verification authenticates each candidate against its live
          # provider, and a burst of failed authentication attempts from CI is indistinguishable
          # from credential stuffing in CloudTrail.
          ARGS='--no-verification'

          # Do not add --results here. Without verification every finding is classified
          # "unverified", so --results=verified or --results=verified,unknown reports nothing.
          # The default (verified,unverified,unknown) is the value we want.

          # TruffleHog exits 183 for a finding and 1 for an operational error, such as a failed
          # image pull or an unreadable commit. The action hardcodes --fail, so warn-only mode
          # appends --no-fail to suppress only the 183 exit. Every other non-zero exit still
          # fails this job, which keeps a scan that never ran from reporting a pass.
          if [[ "$FAIL_ON_FINDINGS" != 'true' ]]; then
            ARGS+=' --no-fail'
          fi

          if [[ -f "$EXCLUDE_PATHS_FILE" ]]; then
            ARGS+=" --exclude-paths=$EXCLUDE_PATHS_FILE"
          else
            echo "No exclude-paths file at '$EXCLUDE_PATHS_FILE'. Scanning every path."
          fi

          echo "Arguments: $ARGS"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      # The image tag carries no leading "v", unlike the action's own release tags.
      #
      # This step has no continue-on-error. In warn-only mode --no-fail already keeps a finding
      # from failing the step, so anything that does fail here is a broken scan and should fail
      # the job.
      - name: Scan for secrets
        # v3.97.4
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          version: 3.97.4
          extra_args: ${{ steps.trufflehogArgs.outputs.args }}

      # TruffleHog needs an access key ID adjacent to a plausible secret to detect an AWS
      # credential, so it misses keys split across separate "key = value" lines. A clean result is
      # a weak signal, not proof.
      - name: Explain how to read the result
        if: ${{ !inputs.fail_on_findings }}
        env:
          EXCLUDE_PATHS_FILE: ${{ inputs.exclude_paths_file }}
        shell: bash
        run: |
          echo "::notice title=Secret scan is warn-only::This check reports findings without blocking the merge. Read the scan step above: TruffleHog lists every finding with its file and commit, and logs a final \"finished scanning\" line with the unverified_secrets count. Rotate any real credential immediately, then add the path to $EXCLUDE_PATHS_FILE if the finding is a dummy value."

