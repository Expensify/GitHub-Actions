# Scans a repository for committed credentials with TruffleHog.
#
# The scan scope follows the event that triggered the calling workflow:
#   - push                          -> scans the commits the push introduced
#   - pull_request                  -> scans only the commits in the pull request
#   - schedule / workflow_dispatch  -> scans the full history
#
# A caller on push covers every commit that reaches the repository, including a branch that never
# opens a pull request. A caller on pull_request adds nothing on top of that for a same-repository
# branch, and is only needed where external forks contribute, because a fork's own push never
# reaches us. Any other event is rejected.
#
# This runs the TruffleHog container directly rather than through trufflesecurity/trufflehog. That
# action hardcodes --fail and gives no way to read the exit code, and TruffleHog uses the exit code
# to distinguish a finding (183) from an operational error (1). Warn-only mode has to suppress the
# first without hiding the second, which the action cannot express.
name: Secret scan

on:
  workflow_call:
    inputs:
      fail_on_findings:
        description: Fail the job when TruffleHog reports a finding. Leave false to warn only while measuring the false-positive rate.
        required: false
        default: false
        type: boolean
      exclude_paths_file:
        description: Repository-relative path to a file of newline-separated regexes for paths to skip. Ignored when the file does not exist.
        required: false
        default: .github/trufflehog-exclude-paths.txt
        type: string
      runner:
        description: Runner label for the scan job. Use a larger runner for full-history scans of large repositories.
        required: false
        default: blacksmith-2vcpu-ubuntu-2404
        type: string

permissions:
  contents: read

env:
  # Pinned by digest rather than tag so the scan cannot change under us. Note that the image tag
  # carries no leading "v", unlike TruffleHog's release tags.
  TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog:3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4

jobs:
  scan:
    name: TruffleHog
    runs-on: ${{ inputs.runner }}
    steps:
      # A pull request scan starts from the base SHA, which a shallow clone does not contain, so
      # fetch the full history.
      - name: Checkout
        # v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          PUSH_REF: ${{ github.event.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXCLUDE_PATHS_FILE: ${{ inputs.exclude_paths_file }}
          FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        shell: bash
        run: |
          set -uo pipefail

          # Limit the scan to the commits the triggering event introduced. An empty range scans
          # the full history, which is what the scheduled and manual runs want.
          #
          # Only list an event whose commits the local clone is guaranteed to hold, because the
          # scan reads file:///repo and cannot reach the remote. That rules out pull_request_target,
          # which checks out the base repository, so an external fork's head commit is absent.
          # Builds a range for a commit whose own starting point is unusable. Scanning from where
          # the commit left the default branch covers everything it adds without re-reading the
          # default branch's history.
          range_from_branch_point() {
            local TIP="$1"
            local BRANCH_POINT
            BRANCH_POINT="$(git merge-base "origin/$DEFAULT_BRANCH" "$TIP" 2>/dev/null || true)"
            if [[ -n "$BRANCH_POINT" && "$BRANCH_POINT" != "$TIP" ]]; then
              SCAN_RANGE=(--since-commit "$BRANCH_POINT" --branch "$TIP")
            else
              # No shared ancestor with the default branch, or the commit is the branch point
              # itself. That happens on an orphan branch, the first push to a new repository, and
              # a force push to the default branch. Scan the whole branch: no later push covers
              # these commits, because the next one starts from this push's head.
              echo "No branch point for $TIP. Scanning its full history."
              SCAN_RANGE=(--branch "$TIP")
            fi
          }

          SCAN_RANGE=()
          case "$EVENT_NAME" in
            pull_request)
              SCAN_RANGE=(--since-commit "$PR_BASE_SHA" --branch "$PR_HEAD_SHA")
              ;;
            push)
              if [[ "$PUSH_AFTER_SHA" =~ ^0+$ ]]; then
                # Deleting a ref introduces no commits.
                echo "This push deleted '$PUSH_REF'. Nothing to scan."
                exit 0

              elif [[ "$PUSH_REF" == refs/tags/* ]]; then
                # A tag usually points at a commit already scanned when it landed on a branch, but
                # git also allows pushing a tag whose commit reaches no branch at all, which
                # transfers that commit with the tag. Only the first case is safe to skip.
                TAGGED_COMMIT="$(git rev-parse --quiet --verify "${PUSH_AFTER_SHA}^{commit}" || true)"
                if [[ -z "$TAGGED_COMMIT" ]]; then
                  echo "Tag '$PUSH_REF' does not resolve to a commit. Nothing to scan."
                  exit 0
                fi
                if [[ -n "$(git for-each-ref --contains "$TAGGED_COMMIT" --count=1 refs/remotes/origin)" ]]; then
                  echo "Tag '$PUSH_REF' points at a commit that is already on a branch, so it was already scanned."
                  exit 0
                fi
                echo "Tag '$PUSH_REF' points at a commit that reaches no branch. Scanning it."
                range_from_branch_point "$TAGGED_COMMIT"

              elif [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
                # Creating a branch reports an all-zero "before", and a force push can leave the
                # old head unreachable from every remaining ref.
                echo "Push reported no usable starting commit. Falling back to the branch point."
                range_from_branch_point "$PUSH_AFTER_SHA"

              else
                SCAN_RANGE=(--since-commit "$PUSH_BEFORE_SHA" --branch "$PUSH_AFTER_SHA")
              fi
              ;;
            schedule | workflow_dispatch)
              echo "Event '$EVENT_NAME' scans the full history."
              ;;
            *)
              echo "::error title=Unsupported event::secretScan.yml does not know how to scope a scan for the '$EVENT_NAME' event. Add a case for it only once you have confirmed the local clone holds the commits it names."
              exit 1
              ;;
          esac

          # A commit git cannot resolve locally makes TruffleHog abort with an operational error
          # that does not say why. Check the range first and report the real cause. Only the
          # 40-character SHAs are commits; the range also carries flag names and their numeric
          # values, such as the --max-depth count.
          for RANGE_ARG in "${SCAN_RANGE[@]}"; do
            if [[ ! "$RANGE_ARG" =~ ^[0-9a-f]{40}$ ]]; then
              continue
            fi
            if ! git cat-file -e "${RANGE_ARG}^{commit}" 2>/dev/null; then
              echo "::error title=Scan range is missing from the clone::Commit $RANGE_ARG is not in the local clone, so the scan range cannot be built. Confirm the checkout step uses fetch-depth: 0."
              exit 1
            fi
          done

          EXCLUDE_PATHS=()
          if [[ -f "$EXCLUDE_PATHS_FILE" ]]; then
            EXCLUDE_PATHS=(--exclude-paths "$EXCLUDE_PATHS_FILE")
          else
            echo "No exclude-paths file at '$EXCLUDE_PATHS_FILE'. Scanning every path."
          fi

          # --no-verification: verification authenticates each candidate against its live provider,
          #   and a burst of failed authentication attempts from CI is indistinguishable from
          #   credential stuffing in CloudTrail.
          # No --results: without verification every finding is classified "unverified", so
          #   --results=verified or --results=verified,unknown would report nothing. The default
          #   (verified,unverified,unknown) is the value we want.
          # --fail: makes TruffleHog exit 183 on a finding, which is how the case below tells a
          #   finding apart from a scan that broke.
          EXIT_CODE=0
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            "$TRUFFLEHOG_IMAGE" \
            git file:///repo/ \
            "${SCAN_RANGE[@]}" \
            "${EXCLUDE_PATHS[@]}" \
            --no-verification \
            --no-update \
            --github-actions \
            --fail || EXIT_CODE=$?

          case "$EXIT_CODE" in
            0)
              echo "TruffleHog completed and found no credentials."
              # TruffleHog needs an access key ID adjacent to a plausible secret to detect an AWS
              # credential, so it misses keys split across separate "key = value" lines.
              echo "A clean scan is a weak signal, not proof. TruffleHog misses a credential whose ID and secret sit on separate lines, so pair it with a git log -G pickaxe sweep."
              ;;
            183)
              if [[ "$FAIL_ON_FINDINGS" == 'true' ]]; then
                echo "::error title=Secret found::TruffleHog reported one or more findings. Read the scan output above for the file and commit. Rotate any real credential immediately, then add the path to $EXCLUDE_PATHS_FILE if the finding is a dummy value."
                exit 1
              fi
              echo "::warning title=Possible secret found, not blocking::TruffleHog reported one or more findings. Read the scan output above for the file and commit. This check warns only, so it does not block the merge. Rotate any real credential immediately, then add the path to $EXCLUDE_PATHS_FILE if the finding is a dummy value."
              ;;
            *)
              # Never downgrade this to a warning. A scan that did not run must not report a pass.
              echo "::error title=Secret scan did not complete::TruffleHog exited $EXIT_CODE, which means the scan itself failed rather than finding a credential. This repository is unscanned until it is fixed."
              exit 1
              ;;
          esac

# vim: set ft=yaml:
