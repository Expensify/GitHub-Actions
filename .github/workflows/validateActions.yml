# Note: This workflow is configured to run on all pull requests throughout the Expensify org, not just this repo.
# That has a few consequences:
#    - We need to checkout the repo it's running on, and not just the GitHub-Actions repo
#    - branch and path matching does not work in the workflow layer. From the docs: https://docs.github.com/en/enterprise-cloud@latest/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets#supported-event-triggers
#        > Any filters you specify for the supported events are ignored - for example, branches, branches-ignore, paths, types and so on. The workflow is only triggered, and is always triggered, by the default activity types of the supported events
name: Validate Github Actions and Workflows

on: pull_request

jobs:
  validateSchemas:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    if: ${{ !contains(github.actor, '[bot]') && github.actor != 'MelvinBot' && github.actor != 'botify' && github.actor != 'OSBotify' }}
    permissions:
      contents: read
      pull-requests: read
    env:
      CHANGED_FILES_PATTERN: '^\.github/workflows/.+\.ya?ml$|(^|/)action\.ya?ml$'
    steps:
      # Rulesets ignore `paths` filters, so this step lists the PR's files through the API and the steps after it are
      # skipped when none of them match the job's CHANGED_FILES_PATTERN. The other jobs reuse it through the anchor.
      - &checkForChangedFiles
        name: Check whether the PR changes files this job checks
        id: changes
        run: |
          # Deleted files are left out because there is nothing left to check
          if ! CHANGED_FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | select(.status != "removed") | .filename | select(test(env.CHANGED_FILES_PATTERN))')"; then
            echo "::warning::Could not list the PR's files, so this check will run anyway"
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$CHANGED_FILES" ]]; then
            echo "Changed files:"
            echo "$CHANGED_FILES"
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          else
            echo "No files this job checks were changed, so the check is skipped"
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Checkout repos
        id: repo
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        uses: Expensify/GitHub-Actions/checkoutRepoAndGitHubActions@main

      # v6.4.0
      - name: Setup Node
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: GitHub-Actions/.nvmrc

      # Install node to get the ajv-cli
      - name: Install node modules
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        run: npm i -g ajv-cli@5.0.0

      - name: Validate action and workflow schemas
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        run: GitHub-Actions/scripts/validateWorkflowSchemas.sh
        env:
          REPO_ROOT: ${{ steps.repo.outputs.NAME }}

      - name: Tell people how to run the failing check
        if: failure()
        run: echo "::error::The validateWorkflowSchemas check failed! To run it locally, go to the root of ${{ steps.repo.outputs.NAME }} and run <path_to_github_actions_repo>/scripts/validateWorkflowSchemas.sh"

  actionlint:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    if: ${{ !contains(github.actor, '[bot]') && github.actor != 'MelvinBot' && github.actor != 'botify' && github.actor != 'OSBotify' }}
    permissions:
      contents: read
      pull-requests: read
    env:
      # actionlint also reads the repo's own config file when there is one
      CHANGED_FILES_PATTERN: '^\.github/workflows/.+\.ya?ml$|(^|/)action\.ya?ml$|^\.github/actionlint\.ya?ml$'
    steps:
      - *checkForChangedFiles

      - name: Checkout repos
        id: repo
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        uses: Expensify/GitHub-Actions/checkoutRepoAndGitHubActions@main

      - name: Lint workflows with actionlint
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        run: GitHub-Actions/scripts/actionlint.sh
        env:
          REPO_ROOT: ${{ steps.repo.outputs.NAME }}

      - name: Tell people how to run the failing check
        if: failure()
        run: echo "::error::The actionlint check failed! To run it locally, go to the root of ${{ steps.repo.outputs.NAME }} and run <path_to_github_actions_repo>/scripts/actionlint.sh"

  validateImmutableActionRefs:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    if: ${{ !contains(github.actor, '[bot]') && github.actor != 'MelvinBot' && github.actor != 'botify' && github.actor != 'OSBotify' }}
    permissions:
      contents: read
      pull-requests: read
    env:
      CHANGED_FILES_PATTERN: '^\.github/workflows/.+\.ya?ml$|(^|/)action\.ya?ml$'
    steps:
      - *checkForChangedFiles

      - name: Checkout repos
        id: repo
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        uses: Expensify/GitHub-Actions/checkoutRepoAndGitHubActions@main

      - name: Validate actions refs are immutable
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        run: GitHub-Actions/scripts/validateImmutableActionRefs.sh
        env:
          REPO_ROOT: ${{ steps.repo.outputs.NAME }}

      - name: Tell people how to run the failing check
        if: failure()
        run: echo "::error::The validateImmutableActionRefs check failed! To run it locally, go to the root of ${{ steps.repo.outputs.NAME }} and run <path_to_github_actions_repo>/scripts/validateImmutableActionRefs.sh"

  validateBlacksmithRunners:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # Unlike the jobs above, this one runs for MelvinBot, since MelvinBot writes PRs that change workflows
    if: ${{ !contains(github.actor, '[bot]') && github.actor != 'botify' && github.actor != 'OSBotify' }}
    # Failures show on the PR without blocking it while repos move to Blacksmith (https://github.com/Expensify/Expensify/issues/706870).
    # Remove this line to make the check block merging.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    env:
      # GitHub only runs workflows at the top level of .github/workflows
      CHANGED_FILES_PATTERN: '^\.github/workflows/[^/]+\.ya?ml$'
    steps:
      - *checkForChangedFiles

      - name: Checkout repos
        id: repo
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        uses: Expensify/GitHub-Actions/checkoutRepoAndGitHubActions@main

      # v6.4.0
      - name: Setup Node
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: GitHub-Actions/.nvmrc
          cache: npm
          cache-dependency-path: GitHub-Actions/package-lock.json

      - name: Install npm packages
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        run: npm ci --omit=dev
        working-directory: GitHub-Actions

      # The checkout is the PR's merge commit, and its first parent is the base it was merged onto. That can be newer than
      # github.event.pull_request.base.sha if the base branch moved, so diff against the parent to only see this PR's changes.
      # The checkout is shallow, so the parent's SHA is read from the merge commit and then fetched.
      - name: Fetch the pull request base commit
        id: base
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        run: |
          BASE_SHA="$(git -C "$REPO_NAME" cat-file -p HEAD | awk '/^parent /{print $2; exit}')"
          if [[ -z "$BASE_SHA" ]]; then
            echo "::error::Could not find the parent of the checked out merge commit"
            exit 1
          fi
          git -C "$REPO_NAME" fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "SHA=$BASE_SHA" >> "$GITHUB_OUTPUT"
        env:
          REPO_NAME: ${{ steps.repo.outputs.NAME }}

      - name: Validate that workflows use Blacksmith runners
        if: ${{ steps.changes.outputs.HAS_CHANGES == 'true' }}
        run: npm run validate-blacksmith-runners -- --repo-root "$GITHUB_WORKSPACE/$REPO_NAME" --base-sha "$BASE_SHA"
        working-directory: GitHub-Actions
        env:
          REPO_NAME: ${{ steps.repo.outputs.NAME }}
          BASE_SHA: ${{ steps.base.outputs.SHA }}
