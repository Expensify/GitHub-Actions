# Scans this repository for committed credentials.
#
# Scanning on push rather than on pull_request covers every commit that reaches the repository,
# including a branch that never opens a pull request. The ref is local rather than @main, so a
# pull request that changes secretScan.yml is checked by the version it proposes.
#
# push only covers commits that land after this workflow exists, so run it once from the Actions
# tab to scan the history that predates it. There is no schedule: history does not change, so
# repeating a full scan reports the same answer every time.
name: Secret Scan

on:
  push:
  workflow_dispatch:

jobs:
  secretScan:
    uses: ./.github/workflows/secretScan.yml

