name: Oxfmt

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**/*.[tj]s'
      - '**/*.?[tj]s'
      - '**.yml'
      - '**.yaml'
      - '.oxfmtrc.json'
      - 'package.json'
      - 'bun.lock'
      - '.bun-version'
      - '.npmrc'
      - '.github/workflows/oxfmt.yml'

jobs:
  oxfmt:
    if: ${{ github.actor != 'OSBotify' || github.event_name == 'workflow_call' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        # v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # v2.2.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Check formatting with Oxfmt
        run: bunx oxfmt --check .

      - name: Tell people how to run the failing check
        if: failure()
        run: echo "::error::The Oxfmt check failed! Run \`bun run fmt\` from the GitHub-Actions repo root and commit the changes."
